services:
  db-ai:
    image: ankane/pgvector:v0.5.1
    container_name: ggud-postgres-ai-local
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ggud_ai}
      TZ: Asia/Seoul
    volumes:
      - ./docker-data/postgres-ai:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-ggud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
